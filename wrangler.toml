# Cloudflare Worker Configuration

name = "bot-blocker"
main = "worker.js"
workers_dev = true
compatibility_date = "2026-04-09"
compatibility_flags = ["nodejs_compat"]

# Enable observability (logs, metrics)
[observability]
enabled = true

# Account ID (get from Cloudflare dashboard)
# account_id = "your-account-id-here"

# Routes - configure in Cloudflare dashboard instead
# Or uncomment to configure here:
# routes = [
#   { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" },
#   { pattern = "www.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (if needed)
# [vars]
# ENVIRONMENT = "production"

# For development
# [env.dev]
# name = "bot-blocker-dev"
# vars = { ENVIRONMENT = "development" }

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDurableObject"]
